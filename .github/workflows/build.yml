name: Build PowerTools

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Ordnerstruktur für Maven & Resourcepack aufbauen
        run: |
          # Zielordner erstellen
          mkdir -p src/main/java/de/powertools
          mkdir -p src/main/resources
          mkdir -p resourcepack/assets/powertools/models/item
          mkdir -p resourcepack/assets/powertools/textures/item
          mkdir -p resourcepack/assets/minecraft/items

          # Java-Dateien verschieben
          mv *.java src/main/java/de/powertools/

          # Plugin-Ressourcen verschieben
          mv plugin.yml config.yml src/main/resources/

          # Resourcepack-Dateien sortieren
          mv pack.mcmeta resourcepack/
          mv *.png resourcepack/assets/powertools/textures/item/
          mv abgrund_eimer.json blitz_drill.json chronos_spitzhacke.json midas_axt.json waldzorn_axt.json resourcepack/assets/powertools/models/item/
          mv bucket.json diamond_pickaxe.json golden_axe.json netherite_axe.json netherite_pickaxe.json resourcepack/assets/minecraft/items/

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: JAR bauen
        run: mvn -B clean package

      - name: Resourcepack zippen
        run: |
          cd resourcepack
          zip -r ../PowerTools-ResourcePack.zip .

      - name: Plugin-JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-Plugin
          path: target/PowerTools.jar

      - name: Resourcepack hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-ResourcePack
          path: PowerTools-ResourcePack.zip
